name: Preview

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Write Vercel build settings
        run: |
          mkdir -p .vercel
          printf '%s' '{"projectId":"prj_placeholder","orgId":"team_placeholder","settings":{"framework":"vite","nodeVersion":"24.x"}}' > .vercel/project.json

      - name: Build Project Artifacts
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::VITE_API_URL 저장소 변수가 비어 있어 API 요청이 상대 경로로 나갑니다."
          fi
          vercel build

      - name: Stage build output
        run: mv .vercel/output vercel-output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      - name: Write Vercel project link
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt | tail -n 1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          body=$(printf '🚀 Preview 서버에 배포가 완료되었습니다! 변경 사항을 확인해주세요.\n\n👉 %s' "$PREVIEW_URL")
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$body" --edit-last \
            || gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$body"
