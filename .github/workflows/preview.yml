name: Preview

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview

      - name: Build Project Artifacts
        run: vercel build

      - name: Stage build output
        run: mv .vercel/output vercel-output

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Restore Vercel project link
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt | tail -n 1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with Preview URL
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: vercel-preview
          message: |
            🚀 Preview 서버에 배포가 완료되었습니다! 변경 사항을 확인해주세요.

            👉 ${{ steps.deploy.outputs.preview_url }}
